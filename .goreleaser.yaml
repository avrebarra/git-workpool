version: 2

project_name: git-workpool

builds:
  - id: git-workpool
    main: ./cmd/git-workpool
    binary: git-workpool
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: git-workpool
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: []

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: avrebarra
    name: git-workpool
